name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit Tests (canonical suite)
        run: npm run test:unit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Snapshot Tests
        run: |
          npx tsc -p tsconfig.tests.json
          node .tmp-tests/tests/planSnapshot.test.js

      - name: E2E Typecheck
        run: npm run typecheck:e2e

      - name: Database Bootstrap Verification
        run: npm run db:verify

  # Phase 12: the canonical E2E suite previously escaped CI entirely. Run it
  # against the real Supabase project with the publishable/anon identity only
  # (never service credentials). Test users are tagged e2e-test-* and cleaned
  # up by the suite's cleanup fixtures + the guarded e2e_force_delete_test_user
  # RPC (regex-locked to the e2e-test- prefix).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run canonical E2E suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
